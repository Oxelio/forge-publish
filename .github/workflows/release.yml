name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_level:
        description: Explicit release level override
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin checkout to triggering commit
        run: git reset --hard "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Determine release mode
        id: release-mode
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_LEVEL: ${{ inputs.release_level }}
        run: |
          current_version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          requested_level="${REQUESTED_LEVEL:-auto}"

          if [ "${requested_level}" = "major" ] || [[ "${HEAD_COMMIT_MESSAGE}" == *"[release:major]"* ]]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_args=--major" >> "${GITHUB_OUTPUT}"
          elif [[ "${current_version}" == 0.* ]]; then
            echo "Pre-1.0 releases require an explicit major release request."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "release_args=" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_args=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pin pip
        if: ${{ steps.release-mode.outputs.should_release == 'true' }}
        run: python -m pip install "pip==26.2.1"

      - name: Install release tooling
        if: ${{ steps.release-mode.outputs.should_release == 'true' }}
        run: |
          python -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            -e ".[release]"
          python -m pip check

      - name: Create semantic release
        id: release
        if: ${{ steps.release-mode.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build.txt
          RELEASE_ARGS: ${{ steps.release-mode.outputs.release_args }}
        run: |
          rm -rf dist
          if [ "${RELEASE_ARGS}" = "--major" ]; then
            semantic-release version --major
          else
            semantic-release version
          fi

      - name: Generate distribution checksums
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        run: bash .github/scripts/release-checksums.sh

      - name: Attest distribution provenance
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false

      - name: Upload distributions to GitHub release
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          semantic-release publish --tag "${RELEASE_TAG}"
