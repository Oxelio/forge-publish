name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_level:
        description: Explicit release level override
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin checkout to triggering commit
        run: git reset --hard "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Determine release mode
        id: release-mode
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_LEVEL: ${{ inputs.release_level }}
        run: |
          current_version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          requested_level="${REQUESTED_LEVEL:-auto}"

          if [ "${requested_level}" = "major" ] || [[ "${HEAD_COMMIT_MESSAGE}" == *"[release:major]"* ]]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_args=--major" >> "${GITHUB_OUTPUT}"
          elif [[ "${current_version}" == 0.* ]]; then
            echo "Pre-1.0 releases require an explicit major release request."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "release_args=" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_args=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pin pip
        if: ${{ steps.release-mode.outputs.should_release == 'true' }}
        run: python -m pip install "pip==26.2.1"

      - name: Install release tooling
        if: ${{ steps.release-mode.outputs.should_release == 'true' }}
        run: |
          python -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            -e ".[release]"
          python -m pip check

      - name: Create semantic release
        id: release
        if: ${{ steps.release-mode.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build.txt
          RELEASE_ARGS: ${{ steps.release-mode.outputs.release_args }}
        run: |
          rm -rf dist
          if [ "${RELEASE_ARGS}" = "--major" ]; then
            semantic-release version --major
          else
            semantic-release version
          fi

      - name: Generate and validate release SBOM
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        run: |
          runtime_venv="${RUNNER_TEMP}/forge-publish-sbom-runtime"
          python -m venv "${runtime_venv}"
          "${runtime_venv}/bin/python" -m pip install "pip==26.2.1"
          "${runtime_venv}/bin/python" -m pip install \
            --constraint requirements/tooling.txt dist/*.whl
          "${runtime_venv}/bin/python" -m pip check
          python .github/scripts/release-sbom.py --python "${runtime_venv}/bin/python"

      - name: Generate release checksums
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        run: bash .github/scripts/release-checksums.sh

      - name: Attest release provenance
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false

      - name: Upload distributions to GitHub release
        if: ${{ steps.release-mode.outputs.should_release == 'true' && steps.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          semantic-release publish --tag "${RELEASE_TAG}"

  pypi:
    name: Publish release distributions to PyPI
    needs: release
    if: ${{ needs.release.outputs.released == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/forge-publish/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Retrieve newly published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.whl' --pattern '*.tar.gz' \
            --pattern 'SHA256SUMS' --pattern 'forge-publish.cdx.json' \
            --dir release-assets
          python .github/scripts/pypi-distributions.py \
            --assets release-assets --output pypi-dist --tag "${RELEASE_TAG}"

      - name: Publish the verified wheel and sdist with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/

  pypi-smoke:
    name: Validate end-user PyPI installation
    needs: [release, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install pipx
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "pipx==1.17.11"

      - name: Check the wheel served by PyPI against GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.whl' --dir github-wheel
          # Allow bounded propagation time after the upload; all failures remain visible.
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download --index-url https://pypi.org/simple \
              --no-deps --only-binary=:all: --dest index-wheel \
              "forge-publish==${RELEASE_TAG#v}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then exit 1; fi
            sleep 10
          done
          cmp github-wheel/*.whl index-wheel/*.whl

      - name: Exercise the documented pipx installation and both entry points
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          PIPX_HOME: ${{ runner.temp }}/forge-publish-pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/forge-publish-bin
        run: |
          python -m pipx install --index-url https://pypi.org/simple forge-publish
          "${PIPX_BIN_DIR}/forge-publish" --version
          "${PIPX_BIN_DIR}/forge-publish" --help
          "${PIPX_HOME}/venvs/forge-publish/bin/python" -m forge_publish --help
          "${PIPX_HOME}/venvs/forge-publish/bin/python" -c \
            'import importlib.metadata, os; assert importlib.metadata.version("forge-publish") == os.environ["RELEASE_TAG"][1:]'
          python -m pipx runpip forge-publish check
          python -m pipx uninstall forge-publish
