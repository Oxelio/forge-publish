name: CI

on:
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  integration:
    name: Forgejo integration
    if: ${{ github.event.pull_request.draft == false }}
    uses: ./.github/workflows/integration.yml

  quality:
    name: Quality checks
    needs:
      - integration
    if: ${{ always() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require Forgejo integration
        if: ${{ needs.integration.result != 'success' }}
        run: |
          echo "Forgejo integration did not succeed." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,release]"
          python -m pip check

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Build distribution
        run: python -m build

      - name: Verify built wheel in clean environment
        run: |
          wheel_venv="${RUNNER_TEMP}/forge-publish-wheel"
          python -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install dist/*.whl
          "${wheel_venv}/bin/python" -m pip check
          "${wheel_venv}/bin/forge-publish" --version
          "${wheel_venv}/bin/python" -m forge_publish --help

  python:
    name: Python ${{ matrix.python-version }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  windows:
    name: Windows Python ${{ matrix.python-version }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest
