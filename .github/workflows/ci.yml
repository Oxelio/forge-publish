name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  integration:
    name: Forgejo integration
    if: ${{ github.event.pull_request.draft == false }}
    uses: ./.github/workflows/integration.yml

  dependency_review:
    name: Dependency review
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-patched-versions: true

  quality:
    name: Quality suite
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Pin pip
        run: python -m pip install "pip==26.2.1"

      - name: Install dependencies
        run: |
          python -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            -e ".[dev,release]"
          python -m pip check

      - name: Run Ruff lint
        run: ruff check .

      - name: Verify generated tooling constraints and hook versions
        run: |
          python -m pip install --requirement requirements/generator.txt
          python .github/scripts/tooling-constraints.py --check
          python -m pip check

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Export coverage for SonarQube Cloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Build distribution
        env:
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build.txt
        run: python -m build

      - name: Verify built wheel in clean environment
        run: |
          wheel_venv="${RUNNER_TEMP}/forge-publish-wheel"
          python -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install "pip==26.2.1"
          "${wheel_venv}/bin/python" -m pip install \
            --constraint requirements/tooling.txt \
            dist/*.whl
          "${wheel_venv}/bin/python" -m pip check
          "${wheel_venv}/bin/forge-publish" --version
          "${wheel_venv}/bin/python" -m forge_publish --help

      - name: Generate and validate release SBOM
        run: |
          python .github/scripts/release-sbom.py \
            --python "${RUNNER_TEMP}/forge-publish-wheel/bin/python"
          bash .github/scripts/release-checksums.sh
          release_tag="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python .github/scripts/pypi-distributions.py \
            --assets dist --output "${RUNNER_TEMP}/forge-publish-pypi-dist" \
            --tag "${release_tag}"

      - name: Verify built sdist in clean environment
        run: |
          sdist_venv="${RUNNER_TEMP}/forge-publish-sdist"
          python -m venv "${sdist_venv}"
          "${sdist_venv}/bin/python" -m pip install "pip==26.2.1"
          "${sdist_venv}/bin/python" -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            dist/*.tar.gz
          "${sdist_venv}/bin/python" -m pip check
          "${sdist_venv}/bin/forge-publish" --version
          "${sdist_venv}/bin/python" -m forge_publish --help

  sonar:
    name: SonarQube Cloud
    needs: quality
    # Forks never enter a job with the repository's Sonar secret.
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  typecheck:
    name: Pyright
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Pin pip
        run: python -m pip install "pip==26.2.1"

      - name: Install runtime dependencies
        run: |
          python -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            -e .
          python -m pip check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install locked type checker
        run: |
          npm install --global npm@11.0.0 --ignore-scripts
          test "$(npm --version)" = "11.0.0"
          npm ci --prefix .github/typecheck --ignore-scripts

      - name: Check production types
        run: python .github/scripts/typecheck.py

  python:
    name: Python ${{ matrix.python-version }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pin pip
        run: python -m pip install "pip==26.2.1"

      - name: Install dependencies
        run: |
          python -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            -e ".[dev,release]"
          python -m pip check

      - name: Run tests
        run: pytest

  windows:
    name: Windows Python ${{ matrix.python-version }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pin pip
        run: python -m pip install "pip==26.2.1"

      - name: Install dependencies
        run: |
          python -m pip install --constraint requirements/tooling.txt --build-constraint requirements/build.txt -e ".[dev,release]"
          python -m pip check

      - name: Run tests
        run: pytest

  gate:
    name: Quality checks
    needs:
      - dependency_review
      - integration
      - quality
      - typecheck
      - python
      - windows
      - sonar
    if: ${{ always() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all validation jobs
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          printf 'Dependency review: %s\n' "${DEPENDENCY_REVIEW_RESULT}"
          printf 'Forgejo integration: %s\n' "${INTEGRATION_RESULT}"
          printf 'Quality suite: %s\n' "${QUALITY_RESULT}"
          printf 'Pyright: %s\n' "${TYPECHECK_RESULT}"
          printf 'Python matrix: %s\n' "${PYTHON_RESULT}"
          printf 'Windows matrix: %s\n' "${WINDOWS_RESULT}"
          printf 'SonarQube Cloud: %s\n' "${SONAR_RESULT}"

          if [ "${DEPENDENCY_REVIEW_RESULT}" != "success" ] || \
             [ "${INTEGRATION_RESULT}" != "success" ] || \
             [ "${QUALITY_RESULT}" != "success" ] || \
             [ "${TYPECHECK_RESULT}" != "success" ] || \
             [ "${PYTHON_RESULT}" != "success" ] || \
             [ "${WINDOWS_RESULT}" != "success" ]; then
            exit 1
          fi

          if [ "${IS_FORK}" = "true" ]; then
            if [ "${SONAR_RESULT}" != "skipped" ]; then
              echo 'Expected SonarQube Cloud to be skipped for a fork pull request.' >&2
              exit 1
            fi
          elif [ "${SONAR_RESULT}" != "success" ]; then
            echo 'SonarQube Cloud must succeed for an internal pull request.' >&2
            exit 1
          fi
