name: Forgejo integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Forgejo 16.0.5
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Pin pip
        run: python -m pip install "pip==26.2.1"

      - name: Install forge-publish
        run: |
          python -m pip install \
            --constraint requirements/tooling.txt \
            --build-constraint requirements/build.txt \
            -e .


      - name: Prepare Forgejo TLS files
        run: |
          mkdir -p "${RUNNER_TEMP}/forgejo"
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -days 1 \
            -nodes \
            -keyout "${RUNNER_TEMP}/forgejo/key.pem" \
            -out "${RUNNER_TEMP}/forgejo/cert.pem" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo chown -R 1000:1000 "${RUNNER_TEMP}/forgejo"

      - name: Start Forgejo
        run: |
          docker run \
            --detach \
            --name forgejo \
            --publish 127.0.0.1:3000:3000 \
            --volume "${RUNNER_TEMP}/forgejo:/data" \
            --env USER_UID=1000 \
            --env USER_GID=1000 \
            --env FORGEJO__security__INSTALL_LOCK=true \
            --env FORGEJO__service__DISABLE_REGISTRATION=true \
            --env FORGEJO__server__PROTOCOL=https \
            --env FORGEJO__server__DOMAIN=localhost \
            --env FORGEJO__server__ROOT_URL=https://localhost:3000/ \
            --env FORGEJO__server__HTTP_PORT=3000 \
            --env FORGEJO__server__CERT_FILE=/data/cert.pem \
            --env FORGEJO__server__KEY_FILE=/data/key.pem \
            codeberg.org/forgejo/forgejo:16.0.5@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe

      - name: Wait for Forgejo
        run: |
          for attempt in {1..90}; do
            if curl \
              --cacert "${RUNNER_TEMP}/forgejo/cert.pem" \
              --fail \
              --silent \
              --show-error \
              https://localhost:3000/api/v1/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs forgejo
          exit 1

      - name: Create integration user and token
        run: |
          docker exec \
            --user 1000 \
            forgejo \
            forgejo admin user create \
              --username integration \
              --password integration-password \
              --email integration@example.invalid \
              --must-change-password=false

          token="$(
            docker exec \
              --user 1000 \
              forgejo \
              forgejo admin user generate-access-token \
                --username integration \
                --token-name forge-publish-ci \
                --raw \
                --scopes write:package |
              tr -d '\r\n'
          )"

          if [ -z "${token}" ]; then
            echo "Forgejo did not return an access token." >&2
            exit 1
          fi

          echo "::add-mask::${token}"
          echo "FORGE_PUBLISH_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Configure forge-publish
        run: |
          forge-publish config \
            --url https://localhost:3000 \
            --owner integration \
            --username integration

      - name: Reject untrusted TLS certificate
        run: |
          printf 'untrusted TLS integration\n' > "${RUNNER_TEMP}/untrusted-tls.bin"

          if forge-publish generic "${RUNNER_TEMP}/untrusted-tls.bin" \
            --package untrusted-tls \
            --version 1.0.0 \
            2> "${RUNNER_TEMP}/untrusted-tls.log"; then
            echo "Expected the untrusted Forgejo certificate to be rejected." >&2
            exit 1
          fi
          grep -q 'CERTIFICATE_VERIFY_FAILED' "${RUNNER_TEMP}/untrusted-tls.log"

      - name: Publish Generic package with verified TLS
        env:
          REQUESTS_CA_BUNDLE: ${{ runner.temp }}/forgejo/cert.pem
        run: |
          printf 'forge-publish integration\n' > "${RUNNER_TEMP}/integration.bin"

          forge-publish generic "${RUNNER_TEMP}/integration.bin" \
            --package integration-generic \
            --version 1.0.0

      - name: Publish Generic package with explicit insecure opt-in
        run: |
          forge-publish generic "${RUNNER_TEMP}/untrusted-tls.bin" \
            --package insecure-opt-in \
            --version 1.0.0 \
            --insecure

      - name: Reject read-only package token
        env:
          REQUESTS_CA_BUNDLE: ${{ runner.temp }}/forgejo/cert.pem
        run: |
          token="$(
            docker exec \
              --user 1000 \
              forgejo \
              forgejo admin user generate-access-token \
                --username integration \
                --token-name forge-publish-read-only-ci \
                --raw \
                --scopes read:package |
              tr -d '\r\n'
          )"
          if [ -z "${token}" ]; then
            echo "Forgejo did not return a read-only access token." >&2
            exit 1
          fi
          echo "::add-mask::${token}"

          if FORGE_PUBLISH_TOKEN="${token}" forge-publish generic \
            "${RUNNER_TEMP}/integration.bin" \
            --package read-only-auth \
            --version 1.0.0 \
            2> "${RUNNER_TEMP}/read-only-auth.log"; then
            echo "Expected Forgejo to reject a read-only package token." >&2
            exit 1
          fi
          grep -Eq 'HTTP (401|403):' "${RUNNER_TEMP}/read-only-auth.log"

      - name: Prepare NPM integration fixtures
        run: |
          create_fixture() {
            package_root="$1"
            package_version="$2"
            cp -R tests/fixtures/npm_lifecycle "${package_root}"
            jq --arg version "${package_version}" '.version = $version' \
              "${package_root}/package.json" > "${package_root}/package.json.tmp"
            mv "${package_root}/package.json.tmp" "${package_root}/package.json"

            cat > "${package_root}/.npmrc" <<'EOF'
          strict-ssl=false
          ignore-scripts=false
          //localhost:3000/api/packages/integration/npm/:_authToken=project-token-must-not-win
          EOF
          }

          create_fixture "${RUNNER_TEMP}/npm-package-bundled" "1.0.0"
          create_fixture "${RUNNER_TEMP}/npm-package-minimum" "1.0.1"
          create_fixture "${RUNNER_TEMP}/npm-package-opt-in" "1.0.2"
          create_fixture "${RUNNER_TEMP}/npm-package-invalid-auth" "1.0.3"
          # Explicit consent must also override a restrictive project setting.
          printf 'ignore-scripts=true\n' >> "${RUNNER_TEMP}/npm-package-opt-in/.npmrc"

      - name: Publish NPM package with bundled npm
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/forgejo/cert.pem
        run: |
          printf 'Bundled npm version: %s\n' "$(npm --version)"
          python .github/scripts/npm-integration.py "${RUNNER_TEMP}/npm-package-bundled"
          test ! -e "${RUNNER_TEMP}/npm-package-bundled/lifecycle-events.txt"

      - name: Install minimum supported npm
        run: |
          npm install --global npm@11.0.0
          test "$(npm --version)" = "11.0.0"

      - name: Publish NPM package with minimum npm
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/forgejo/cert.pem
        run: |
          python .github/scripts/npm-integration.py "${RUNNER_TEMP}/npm-package-minimum"
          test ! -e "${RUNNER_TEMP}/npm-package-minimum/lifecycle-events.txt"

      - name: Publish NPM package with explicit pack script consent
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/forgejo/cert.pem
          NPM_TOKEN: fake-npm-token
          NODE_AUTH_TOKEN: fake-node-token
          FORGE_PUBLISH_NPM_AUTH_TOKEN: inherited-token-must-not-reach-hooks
          FoRgE_PuBlIsH_NpM_AuTh_ToKeN: mixed-case-token-must-not-reach-hooks
        run: |
          python .github/scripts/npm-integration.py \
            "${RUNNER_TEMP}/npm-package-opt-in" --allow-pack-scripts
          printf 'prepack\nprepare\npostpack\n' > "${RUNNER_TEMP}/expected-lifecycle.txt"
          diff "${RUNNER_TEMP}/expected-lifecycle.txt" \
            "${RUNNER_TEMP}/npm-package-opt-in/lifecycle-events.txt"

      - name: Reject NPM authentication without leaking credentials
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/forgejo/cert.pem
          FORGE_PUBLISH_TOKEN: invalid-npm-integration-credential
        run: |
          python .github/scripts/npm-integration.py \
            "${RUNNER_TEMP}/npm-package-invalid-auth" --expect-auth-failure
          test ! -e "${RUNNER_TEMP}/npm-package-invalid-auth/lifecycle-events.txt"

      - name: Reject invalid authentication
        env:
          REQUESTS_CA_BUNDLE: ${{ runner.temp }}/forgejo/cert.pem
        run: |
          printf 'invalid auth integration\n' > "${RUNNER_TEMP}/invalid-auth.bin"

          if FORGE_PUBLISH_TOKEN=invalid-token forge-publish generic \
            "${RUNNER_TEMP}/invalid-auth.bin" \
            --package invalid-auth \
            --version 1.0.0 \
            2> "${RUNNER_TEMP}/invalid-auth.log"; then
            echo "Expected Forgejo to reject invalid credentials." >&2
            exit 1
          fi
          grep -Eq 'HTTP (401|403):' "${RUNNER_TEMP}/invalid-auth.log"

      - name: Build Debian fixture
        run: |
          package_root="${RUNNER_TEMP}/debian-package"
          mkdir -p "${package_root}/DEBIAN"
          mkdir -p "${package_root}/usr/share/forge-publish"

          cat > "${package_root}/DEBIAN/control" <<'EOF'
          Package: forge-publish-integration
          Version: 1.0.0
          Architecture: all
          Maintainer: forge-publish CI <integration@example.invalid>
          Description: forge-publish integration test package
          EOF

          printf 'forge-publish integration\n' > \
            "${package_root}/usr/share/forge-publish/integration.txt"

          dpkg-deb \
            --build "${package_root}" \
            "${RUNNER_TEMP}/forge-publish-integration_1.0.0_all.deb"

      - name: Publish Debian package with verified TLS
        env:
          REQUESTS_CA_BUNDLE: ${{ runner.temp }}/forgejo/cert.pem
        run: |
          forge-publish deb \
            "${RUNNER_TEMP}/forge-publish-integration_1.0.0_all.deb" \
            --distribution integration \
            --component main

      - name: Show Forgejo logs on failure
        if: ${{ failure() }}
        run: docker logs forgejo

      - name: Stop Forgejo
        if: ${{ always() }}
        run: docker rm --force forgejo
