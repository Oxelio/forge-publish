[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-publish"
version = "2.3.0"
description = "CLI for publishing packages to Forgejo package registries"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "keyring>=25",
    "platformdirs>=4.3",
    "requests>=2.31",
    "tomli-w>=1.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.13",
    "pre-commit",
    "commitizen",
]
release = [
    "build>=1.2",
    "cyclonedx-bom==7.5.0",
    "python-semantic-release==10.7.0",
]

[project.scripts]
forge-publish = "forge_publish.cli:main"

[project.urls]
Repository = "https://github.com/Oxelio/forge-publish"
Issues = "https://github.com/Oxelio/forge-publish/issues"
Releases = "https://github.com/Oxelio/forge-publish/releases"
Security = "https://github.com/Oxelio/forge-publish/blob/main/.github/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--cov=forge_publish",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
]

[tool.coverage.run]
# Keep XML paths portable between the pytest runner and the Sonar analysis job.
relative_files = true

[tool.uv]
# Universal constraints generation covers the supported CI environments.
environments = [
    "python_version >= '3.11' and python_version < '3.15' and sys_platform == 'linux'",
    "python_version >= '3.11' and python_version < '3.15' and sys_platform == 'win32'",
]

[tool.pyright]
# Start with production code; tests and CI scripts remain covered by Ruff/pytest.
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = false
major_on_zero = true
commit_message = "chore(release): {version} [skip ci]"
build_command = "python -m build --sdist --wheel ."

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz", "dist/forge-publish.cdx.json", "dist/SHA256SUMS"]
