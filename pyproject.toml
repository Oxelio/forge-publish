[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-publish"
version = "0.1.0"
description = "CLI for publishing packages to Forgejo package registries"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "keyring>=25",
    "requests>=2.31",
    "tomli-w>=1.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
forge-publish = "forge_publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
