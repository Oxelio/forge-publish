repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]

      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.20.0
    hooks:
      - id: commitizen
        stages: [commit-msg]